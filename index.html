<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aplicación web para buscar usuarios de GitHub y consultar su información pública en tiempo real mediante la API oficial.">
  <title>Buscador de usuarios de GitHub</title>
  
  <!-- Tipografía moderna Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Hoja de estilos externa -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Encabezado principal semántico -->
  <header class="encabezado-principal">
    <h1 class="encabezado-principal__titulo">Buscador de usuarios de GitHub</h1>
    <p class="encabezado-principal__subtitulo">Consulta la información pública de perfiles utilizando la API REST oficial.</p>
  </header>

  <!-- Contenedor semántico principal -->
  <main class="contenedor-principal">
    
    <!-- Sección del formulario de búsqueda -->
    <section class="seccion-busqueda" aria-labelledby="titulo-busqueda">
      <h2 id="titulo-busqueda" class="sr-only">Formulario para consultar usuario</h2>

      <form id="formulario-usuario" class="formulario" novalidate>
        <label for="input-usuario" class="formulario__label">Nombre de usuario:</label>
        
        <input 
          type="text" 
          id="input-usuario" 
          name="username" 
          class="formulario__input" 
          placeholder="Ejemplo: octocat" 
          autocomplete="off" 
          spellcheck="false"
        >

        <button type="submit" id="btn-buscar" class="formulario__boton">
          Buscar
        </button>
      </form>

      <!-- Zona accesible para estado de carga y mensajes dinámicos -->
      <p 
        id="mensaje-estado" 
        class="mensaje-estado" 
        role="status" 
        aria-live="polite"
      ></p>
    </section>

    <!-- Sección de presentación del resultado -->
    <section class="seccion-resultado" aria-label="Resultado de la búsqueda">
      <article id="tarjeta-usuario" class="tarjeta-usuario" hidden>
        <figure class="tarjeta-usuario__figura">
          <img 
            id="avatar-usuario" 
            class="tarjeta-usuario__avatar" 
            src="" 
            alt="Avatar del usuario" 
            width="120" 
            height="120"
          >
        </figure>

        <header class="tarjeta-usuario__perfil">
          <h2 id="nombre-usuario" class="tarjeta-usuario__nombre"></h2>
          <p id="login-usuario" class="tarjeta-usuario__login"></p>
        </header>

        <ul class="tarjeta-usuario__estadisticas">
          <li class="tarjeta-usuario__estadistica-item">
            <span class="tarjeta-usuario__estadistica-label">Repositorios públicos:</span>
            <strong id="repos-usuario" class="tarjeta-usuario__estadistica-valor">0</strong>
          </li>
        </ul>

        <p class="tarjeta-usuario__accion">
          <a 
            id="enlace-github" 
            class="tarjeta-usuario__enlace" 
            href="#" 
            target="_blank" 
            rel="noopener noreferrer"
          >
            Ver perfil en GitHub
          </a>
        </p>
      </article>
    </section>

  </main>

  <!-- Pie de página semántico -->
  <footer class="pie-pagina">
    <p class="pie-pagina__texto">Ejercicio académico: HTML5 semántico, CSS3 y JavaScript moderno con Fetch API.</p>
  </footer>

  <!-- Lógica en archivo JS externo -->
  <script src="script.js"></script>
</body>
</html>
